<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read Later</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/style.css?v=4">
<script>
(function(){try{var p=JSON.parse(localStorage.getItem("readlater.reader.prefs"))||{};if(p.theme)document.documentElement.className="theme-"+p.theme;}catch(e){}})();
</script>
<script src="/static/theme.js" defer></script>
<script src="/static/vendor/htmx.min.js" defer></script>
<script src="/static/library.js?v=4" defer></script>
</head>
<body>
<div class="container">
  <header>
    <h1>📑 Read Later</h1>
    <button id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">🌙</button>
  </header>

  <section class="add">
    <form method="POST" action="/">
      <input type="text" name="url" aria-label="Article URL" placeholder="Paste an article URL to archive…" required>
      <button type="submit">Archive</button>
    </form>
    {{if .Error}}
      <p class="error">⚠️ {{.Error}}</p>
    {{end}}
  </section>

  {{template "library" .}}

  <section class="bookmarklet">
    <p>Drag this to your bookmarks bar to archive any page in one click:</p>
    <p>{{.Bookmarklet}}</p>
  </section>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/sw.js').catch(function() {});
  });
}
</script>
</body>
</html>
