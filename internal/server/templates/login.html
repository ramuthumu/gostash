<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Sign in · GoStash</title>
<style>
:root{color-scheme:light dark;--bg:#fafaf7;--fg:#1a1a1a;--muted:#6b6b6b;--accent:#2563eb;--border:#e3e3dd;--card:#fff;--danger:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#ededed;--muted:#aaa;--accent:#75a7ff;--border:#383838;--card:#222;--danger:#ff8181}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:min(100% - 2rem,24rem);padding:2rem;background:var(--card);border:1px solid var(--border);border-radius:12px}
h1{margin:0 0 .25rem;font-size:1.5rem}p{color:var(--muted);margin:.25rem 0 1.5rem}
label{display:block;font-weight:600;margin-bottom:.4rem}input{width:100%;padding:.75rem;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--fg);font:inherit}
input:focus{outline:2px solid var(--accent);border-color:transparent}button{width:100%;margin-top:1rem;padding:.75rem;border:0;border-radius:7px;background:var(--accent);color:white;font:inherit;font-weight:600;cursor:pointer}
.error{color:var(--danger);margin:.75rem 0 0}
</style>
</head>
<body>
<main>
  <h1>📑 GoStash</h1>
  <p>Sign in to your reading library.</p>
  <form method="POST" action="/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
    {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
  </form>
</main>
<script>
if ('caches' in window) caches.keys().then(function(keys) {
  return Promise.all(keys.map(function(key) { return caches.delete(key); }));
});
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(registrations) {
  return Promise.all(registrations.map(function(registration) { return registration.unregister(); }));
});
</script>
</body>
</html>
